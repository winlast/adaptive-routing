# nginx перед чужим сервисом. Единственное, что здесь важно, — формат
# журнала: в конце строки записывается $request_time. Без него журнал
# не годится ни для какой диагностики, и это первое, что нужно включить
# у себя.
worker_processes  1;
events { worker_connections 1024; }

http {
    log_format timed '$remote_addr - - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log timed;
    error_log  /var/log/nginx/error.log warn;

    upstream backend { server api:3000; }

    server {
        listen 8500;
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
