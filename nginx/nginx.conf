# nginx с маршрутизацией по оценке стоимости запроса.
#
# Сравнение честное: в этом же файле поднят маршрут /baseline с обычной
# балансировкой по числу соединений. Трафик один и тот же, движки те же,
# различается только способ выбора.

worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 1024; }

env LOADLENS_BUDGET;

http {
    access_log off;
    lua_package_path "/etc/loadlens/?.lua;;";

    # Занятость движков общая для всех рабочих процессов.
    lua_shared_dict loadlens 10m;

    init_by_lua_block {
        loadlens = require "loadlens"
        loadlens.init("/etc/loadlens/power_law.json")
    }

    upstream sync_pool  { server sync:8201; keepalive 64; }
    upstream async_pool { server async:8202; keepalive 64; }

    # Обычная балансировка: nginx не знает, сколько стоит запрос, и
    # считает все обращения к одному адресу одинаковыми.
    upstream baseline_pool {
        least_conn;
        server sync:8201;
        server async:8202;
        keepalive 64;
    }

    server {
        listen 8600;

        location /route {
            set $target sync_pool;
            access_by_lua_block { loadlens.decide() }
            log_by_lua_block    { loadlens.release() }
            proxy_pass http://$target/process;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /baseline {
            proxy_pass http://baseline_pool/process;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /status {
            content_by_lua_block { loadlens.status() }
        }
    }
}
